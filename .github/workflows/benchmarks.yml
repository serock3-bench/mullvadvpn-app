name: Benchmarks

on:
  schedule:
    - cron: '17 1 * * *'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Comma or space-delimited benchmark IDs, or "default"/"all"
        required: false
        default: default
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    uses: Serock3/benchy/.github/workflows/run-benchmarks.yml@main
    with:
      benchmarks: ${{ inputs.benchmarks || 'default' }}
      manifest-path: benchmarks/Cargo.toml
